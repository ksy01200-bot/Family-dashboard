<html lang="ko" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFBF2">
<meta name="description" content="온 가족의 일정·등교준비·공부·토큰 도장판을 한 화면에">
<title>우리 가족 대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
<script>
/* 이 기기에서 이미 잠금을 풀었다면, 화면이 그려지기 전에 잠금 표시를 먼저 지웁니다.
   (잠금 화면이 깜빡였다 사라지는 것을 막기 위한 한 줄) */

  try {
    if (localStorage.getItem('familyDashboard.lock.v1') === '1') {
      document.documentElement.className = document.documentElement.className.replace(/\blocked\b/g, '');
    }
  } catch (e) {}
})();
</script>
<style>
:root{
  --cream:#FFFBF2; --card:#FFFFFF; --ink:#4A3B33; --ink2:#6F5F53; --muted:#A2937F;
  --line:#F1E6D6; --peach:#FFD9C0; --pink:#FFE3EC; --mint:#DCF3E8; --sky:#DFECFF; --lemon:#FFF4C9; --lav:#E9E4FF;
  --accent:#F29B86; --accent-deep:#DF7358; --green:#7ECBA1; --green-deep:#4FA97A;
  --shadow:0 10px 26px rgba(176,143,110,.13); --shadow-s:0 3px 10px rgba(176,143,110,.10);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--cream); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 6% -4%, #FFF4DD 0%, rgba(255,244,221,0) 62%),
                   radial-gradient(700px 380px at 104% 4%, #FFEFF3 0%, rgba(255,239,243,0) 60%),
                   radial-gradient(700px 420px at 50% 108%, #EFF7F1 0%, rgba(239,247,241,0) 62%);
  background-attachment:fixed;
  display:flex; flex-direction:column;
  height:100vh; height:100dvh;
  overflow:hidden; overscroll-behavior:none;
}
body.no-scroll{overflow:hidden}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none !important}

/* ---------- header ---------- */
.topbar{
  position:relative; z-index:40; flex:0 0 auto; width:100%; max-width:560px; margin:0 auto;
  display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
  background:linear-gradient(180deg, rgba(255,251,242,.97) 62%, rgba(255,251,242,.75));
  backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand>div{min-width:0}
.brand .logo{font-size:24px;line-height:1;filter:drop-shadow(0 2px 3px rgba(180,140,100,.25))}
.brand h1{font-size:20px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  flex:0 0 auto; width:44px;height:44px;border-radius:16px;background:#fff;box-shadow:var(--shadow-s);
  font-size:19px;display:grid;place-items:center;transition:transform .12s;
}
.icon-btn:active{transform:scale(.94)}
@media (max-width:360px){
  .topbar{gap:8px;padding-left:13px;padding-right:13px}
  .brand .logo{font-size:21px}
  .brand h1{font-size:17px}
  .brand p{font-size:11px}
  .icon-btn{width:40px;height:40px;border-radius:14px;font-size:17px}
}

/* ---------- layout: 좌우 스와이프 페이지 ---------- */
main.pager{
  position:relative; flex:1 1 auto; min-height:0; width:100%; max-width:560px; margin:0 auto;
  overflow:hidden; overscroll-behavior:none; touch-action:pan-y;
}
main.pager .track{
  display:flex; align-items:stretch; height:100%; width:100%;
  transform:translate3d(0,0,0); will-change:transform; backface-visibility:hidden;
}
main.pager .track.animating{transition:transform .34s cubic-bezier(.22,.75,.25,1)}
main.pager.dragging{cursor:grabbing}
main.pager.dragging .page,main.pager.dragging .page *{user-select:none;-webkit-user-select:none}
.page{
  flex:0 0 100%; width:100%; height:100%;
  overflow-y:auto; overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  scrollbar-width:none; -ms-overflow-style:none;
  outline:none;
}
.page::-webkit-scrollbar{display:none;width:0;height:0}
.page .who-tabs{touch-action:pan-x}
@media (prefers-reduced-motion: reduce){
  main.pager .track.animating{transition-duration:.01ms}
}

/* 페이지 인디케이터 (점) */
.pind{
  position:relative; z-index:39; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; gap:9px; padding:1px 0 5px;
}
.pind button{
  position:relative; width:8px; height:8px; padding:0; border:0; border-radius:999px;
  background:#E5D6C2; transition:width .28s cubic-bezier(.3,1,.4,1), background .2s, opacity .15s;
  opacity:calc(.5 + .5 * var(--k,0));
}
.pind button::after{content:'';position:absolute;inset:-8px;border-radius:999px}
.pind button.on{width:24px;background:var(--accent-deep);opacity:1}
.pind button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{
  background:var(--card); border-radius:var(--r); padding:16px 15px 14px; margin-bottom:13px;
  box-shadow:var(--shadow); border:1px solid #FFF4E6;
}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2{font-size:17px}
.card-h .sub{font-size:12px;color:var(--muted);margin-top:2px}
.empty{font-size:13.5px;color:var(--muted);padding:12px 2px;text-align:center}
.empty.sm{padding:6px 2px;text-align:left;font-size:12.5px}
.mt8{margin-top:8px}

/* ---------- who tabs ---------- */
.who-tabs{display:flex;gap:7px;margin:2px 0 12px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
.who-tabs::-webkit-scrollbar{display:none}
.who{
  flex:1 0 auto; display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;
  background:#FBF4E9;border:1.5px solid transparent;transition:.16s;
}
.who .who-av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.who .who-nm{font-size:14px;font-weight:700;color:var(--ink2)}
.who.on{background:#fff;border-color:var(--peach);box-shadow:var(--shadow-s)}
.who.on .who-nm{color:var(--ink)}

/* ---------- avatars, chips ---------- */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.av.lg{width:50px;height:50px;font-size:25px}
.av.xs{width:24px;height:24px;font-size:13px;font-style:normal;border:1.5px solid #fff}
.tk{font-size:12px;font-weight:700;background:var(--lemon);color:#8A6A2F;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tk.big{font-size:14px;padding:5px 11px}
.bar{height:10px;background:#F6EDE0;border-radius:99px;overflow:hidden}
.bar.sm{height:7px;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFD3A8,#FFB394);transition:width .4s cubic-bezier(.3,1,.4,1)}
.btn{
  min-height:46px;padding:0 18px;border-radius:15px;background:var(--accent-deep);color:#fff;
  font-size:15px;font-weight:800;box-shadow:0 6px 14px rgba(223,115,88,.28);transition:transform .12s,opacity .2s;
}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn.ghost{background:#F8EFE2;color:var(--ink2);box-shadow:none}
.btn.danger{background:#E4695F;box-shadow:0 6px 14px rgba(228,105,95,.25)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.wide{width:100%;margin-top:10px}

/* ---------- weather ---------- */
.weather .w-row{display:flex;align-items:center;gap:12px}
.w-icon{font-size:38px;line-height:1;filter:drop-shadow(0 3px 4px rgba(190,150,110,.22))}
.w-main{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.w-temp{font-size:30px;font-weight:800;letter-spacing:-.03em}
.w-sky{font-size:14px;color:var(--ink2);font-weight:700}
.w-minmax{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:12.5px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px;background:#FBF4E9;color:var(--ink2)}
.chip.rain{background:#E4EEFF;color:#3F6499}
.chip.coat{background:#FFE9E0;color:#A55C3F}
.chip.water{background:#DFF3FF;color:#3B7A9B}
.chip.snow{background:#EDF4FF;color:#4E6E9C}
.chip.none{background:#E7F5EC;color:#4E8C6B}
.src{font-size:11.5px;color:#BBAC9B;margin-top:10px}
.weather.err .w-row{margin-bottom:4px}

/* ---------- schedules ---------- */
.s-list{display:flex;flex-direction:column}
.s-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.s-row:last-child{border-bottom:0;padding-bottom:2px}
.s-time{flex:0 0 56px;font-size:11.5px;font-weight:800;color:var(--accent-deep);text-align:right;letter-spacing:-.03em}
.s-time i{display:block;font-style:normal;white-space:nowrap}
.s-time i.end{font-size:10.5px;color:#D79A86;font-weight:700}
.s-time i.allday{font-size:11px;color:#B9A692}
.s-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.s-b b{font-size:14.5px;font-weight:700}
.s-b small{font-size:12px;color:var(--muted)}
.s-av{display:flex;gap:2px;flex:0 0 auto}
.x-btn{flex:0 0 auto;width:30px;height:30px;border-radius:10px;font-size:13px;color:#C1A996;display:grid;place-items:center}
.x-btn:active{background:#F7EEE2}
.tmr{margin-top:10px;font-size:12.5px;color:var(--muted);background:#FBF7EF;border-radius:12px;padding:8px 11px}
.tmr b{color:var(--ink2);margin-right:5px}
.day-h{display:flex;align-items:center;justify-content:space-between;padding:9px 2px 6px;margin-top:6px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.day-h b{font-size:13.5px;color:var(--ink2)}
.day-block.today{background:#FFFAF1;border-radius:16px;padding:0 9px 6px;margin:6px -6px 0;box-shadow:inset 0 0 0 1.5px #FFEDD8}
.day-block.today .day-h b{color:var(--accent-deep)}
.day-block.today .day-h{border-bottom-color:#F6E3CB}

/* ---------- morning routine ---------- */
.cnt{font-size:20px;font-weight:800;color:var(--accent-deep)}
.cnt span{font-size:13px;color:var(--muted);font-weight:700}
.steps{position:relative;margin:12px 0 6px}
.steps::before{
  content:'';position:absolute;left:25px;top:34px;bottom:34px;width:2px;
  background:repeating-linear-gradient(#F2E5D3 0 5px, rgba(0,0,0,0) 5px 11px);
}
.step{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:6px 0;background:none;border-radius:16px;
}
.stamp{
  position:relative;z-index:1;flex:0 0 auto;width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;font-size:23px;background:#FFFDF8;border:2.5px dashed #E8DAC7;
  transition:border-color .2s, background .2s, transform .2s;
}
.step.on .stamp{
  background:#FFF1EC;border:2.5px solid #F0A08C;color:#C4533A;
  transform:rotate(-7deg);box-shadow:inset 0 0 0 3px #FFE3DA, 0 3px 8px rgba(240,160,140,.28);
}
.stamp.pop{animation:stampIn .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes stampIn{
  0%{transform:scale(1.9) rotate(-24deg);opacity:0}
  55%{transform:scale(.86) rotate(-3deg);opacity:1}
  75%{transform:scale(1.06) rotate(-9deg)}
  100%{transform:scale(1) rotate(-7deg)}
}
.step-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.step-b b{font-size:15px;font-weight:800}
.step-b small{font-size:12px;color:var(--muted)}
.step.on .step-b b{color:var(--ink2)}
.step.on .step-b small{color:#C0B0A0}
.step-n{
  flex:0 0 auto;min-width:34px;text-align:center;font-size:12px;font-weight:800;color:#C9B9A6;
}
.step.on .step-n{color:#E4886F}
.done-badge{
  margin-top:10px;text-align:center;font-size:13.5px;font-weight:800;color:#3F7F60;
  background:#E7F6ED;border-radius:14px;padding:10px;animation:pop .5s cubic-bezier(.2,1.5,.4,1);
}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
.morning-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.morning-foot .hint{font-size:12px;color:var(--muted);font-weight:700}

/* ---------- 잠자리 준비 (밤 루틴) ---------- */
.night .steps{margin:10px 0 4px}
.night .steps::before{left:21px;top:26px;bottom:26px;
  background:repeating-linear-gradient(#E7E3F6 0 5px, rgba(0,0,0,0) 5px 11px)}
.night .step{gap:11px;padding:4px 0}
.night .stamp{width:44px;height:44px;font-size:20px;background:#FCFBFF;border:2.5px dashed #DFDAF1}
.night .step.on .stamp{background:#EFEBFF;border:2.5px solid #9C90DE;color:#584BA7;
  transform:rotate(-6deg);box-shadow:inset 0 0 0 3px #E4DFFF, 0 3px 8px rgba(150,140,215,.26)}
.night .step-b b{font-size:15px}
.night .step-n{min-width:30px}
.night .bar>i{background:linear-gradient(90deg,#D8D1FF,#B4A7F0)}
.night .done-badge{color:#4A3F8E;background:#EDE9FF}
.night .morning-foot .hint{color:#8C82B8}

/* ---------- 등교 카운트다운 ---------- */
.cd-day{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--ink2);background:#FBF4E9;border-radius:999px;padding:5px 11px}
.cd-rows{display:flex;flex-direction:column;gap:9px}
.cd-row{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:18px;
  background:#FBF7EF;border:1.5px solid transparent;
  transition:background .25s, border-color .25s;
}
.cd-av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px}
.cd-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cd-who b{font-size:15px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cd-who small{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.cd-ov{
  font-style:normal;font-size:10px;font-weight:800;color:#A2661F;background:#FFF1C9;
  border-radius:6px;padding:1px 5px;letter-spacing:-.01em;
}
.cd-t{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.cd-num{
  display:block;font-size:25px;font-weight:800;line-height:1.08;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;
}
.cd-note{
  display:block;font-size:11px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums;line-height:1.3;
  white-space:nowrap;max-width:142px;overflow:hidden;text-overflow:ellipsis;
}
.cd-row.run .cd-num{color:var(--green-deep)}
.cd-row.warn{background:#FFF6E5;border-color:#FFE0AE}
.cd-row.warn .cd-num{color:#C98A1E}
.cd-row.warn .cd-note{color:#B48224}
.cd-row.urgent{background:#FFEDE8;border-color:#FFC7B6;animation:cdPulse 1.7s ease-in-out infinite}
.cd-row.urgent .cd-num{color:#D9533E}
.cd-row.urgent .cd-note{color:#C4695E}
.cd-row.done{background:#EFF8F2}
.cd-row.done .cd-num{color:var(--green-deep);font-size:20px}
.cd-row.weekend{background:#F4F1FB}
.cd-row.weekend .cd-num{color:#7C74A8;font-size:20px}
@keyframes cdPulse{0%,100%{box-shadow:0 0 0 0 rgba(217,83,62,0)}50%{box-shadow:0 0 0 4px rgba(217,83,62,.11)}}
.cd-tip{margin-top:9px;font-size:11.5px;font-weight:800;color:#A2661F;background:#FFF7DF;border-radius:11px;padding:7px 10px}
.cd-next{margin-top:9px;font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cd-next:empty{display:none}
@media (prefers-reduced-motion: reduce){.cd-row.urgent{animation:none}}
@media (max-width:360px){
  .cd-row{padding:10px 10px;gap:9px}
  .cd-av{width:32px;height:32px;font-size:17px}
  .cd-who b{font-size:14px}
  .cd-num{font-size:22px}
  .cd-row.done .cd-num,.cd-row.weekend .cd-num{font-size:18px}
}

/* ---------- agenda ---------- */
.ag{padding:10px 0;border-bottom:1px dashed var(--line)}
.ag:last-child{border-bottom:0;padding-bottom:0}
.ag-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ag-h b{font-size:15px}
.ag-who{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.ag-ck{
  position:relative;min-width:52px;height:52px;border-radius:14px;background:#FBF4E9;border:1.5px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:.15s;padding:0 6px;
}
.ag-ck .ag-e{font-size:18px;line-height:1.1}
.ag-ck .ag-n{font-size:9.5px;font-weight:800;color:#B5A491;letter-spacing:-.02em}
.ag-ck.on{background:var(--mc,#DCF3E8);border-color:rgba(255,255,255,.9);box-shadow:var(--shadow-s)}
.ag-ck.on .ag-n{color:#7A6656}
.ag-ck.on::after{
  content:'✓';position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;
  background:var(--green-deep);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 2px 4px rgba(0,0,0,.12);
}

/* ---------- kids overview ---------- */
.kid-row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 0;
  border-bottom:1px dashed var(--line);
}
.kid-row:last-child{border-bottom:0}
.kid-b{flex:1;min-width:0;display:flex;flex-direction:column}
.kid-b b{font-size:15px}
.kid-sub{font-size:12px;color:var(--muted)}

/* ---------- study ---------- */
.kid-head{display:flex;align-items:center;gap:12px}
.kh-b{flex:1;min-width:0;display:flex;flex-direction:column}
.kh-b b{font-size:16px}
.kh-b .sub{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-of-type{border-bottom:0}
.ck{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid #E7D9C7;background:#FFFDF8;
  display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;transition:.15s;
}
.ck.on{background:var(--green);border-color:var(--green);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.row.on .row-b .tt{color:#B7A896;text-decoration:line-through;text-decoration-thickness:1.5px}
.row-b .em{font-style:normal}
.row-b{flex:1;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row-b b{font-size:14.5px;font-weight:700;word-break:break-word}
.row-tools{display:flex;gap:2px;flex:0 0 auto}
.t-btn{width:30px;height:30px;border-radius:9px;font-size:13px;display:grid;place-items:center;opacity:.5}
.t-btn:active{background:#F7EEE2;opacity:1}
.t-btn.pin{opacity:1;background:#FFF4C9}
.t-btn.pin::after{content:'';position:absolute}
.t-btn.del{color:#D08C7E}
.hifive{

.goal-line{font-size:13px;color:var(--ink2);font-weight:700;margin-top:9px}

.goal-edit label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:800}

}

.lg-v.minus{color:#C4695E}

/* ---------- tab bar ---------- */
.tabbar{

}

}

.modal-actions{display:flex;gap:8px;margin-top:20px}

.set-row{padding:13px 0;border-bottom:1px dashed var(--line)}

.set-row p{font-size:12.5px;color:var(--muted);margin-top:2px}
.set-row .btn{margin-top:9px}

/* ---------- toast / fx ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:100%;max-width:520px;padding:0 16px}
.toast{
  background:rgba(74,59,51,.94);color:#FFF9F0;font-size:13.5px;font-weight:700;padding:10px 16px;border-radius:999px;
  box-shadow:0 8px 20px rgba(74,59,51,.28);animation:tin .25s cubic-bezier(.2,1.4,.4,1);
}
.toast.out{opacity:0;transform:translateY(6px);transition:.3s}
@keyframes tin{from{transform:translateY(10px) scale(.95);opacity:0}to{transform:none;opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.float-coin{
  position:fixed;font-size:17px;font-weight:800;color:#B07E1F;transform:translate(-50%,-50%);
  animation:coinUp .95s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 2px 6px rgba(255,255,255,.9);
}
@keyframes coinUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.celebrate{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  background:#fff;border-radius:26px;padding:22px 28px;text-align:center;box-shadow:0 20px 50px rgba(120,90,60,.28);
  display:flex;flex-direction:column;align-items:center;gap:4px;animation:popBig .45s cubic-bezier(.2,1.5,.4,1);
  border:2px solid #FFF0DC;
}
.celebrate .cel-emoji{font-size:52px;line-height:1.1;animation:wob .6s ease}
.celebrate b{font-size:17px}
.celebrate span{font-size:13px;color:var(--muted);font-weight:700}
.celebrate.out{opacity:0;transform:translate(-50%,-50%) scale(.9);transition:.35s}
@keyframes popBig{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg) scale(1.06)}}
.confetti{position:absolute;top:-24px;animation:fall 2.1s linear forwards;font-size:18px}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(320deg);opacity:.9}}
/* ---------- 잠금 화면 (가족 비밀번호 4자리) ---------- */
html.locked .topbar,html.locked .pind,html.locked #pager,html.locked .tabbar{visibility:hidden}
.lock-screen{display:none}
html.locked .lock-screen{
  display:flex; position:fixed; inset:0; z-index:300;
  align-items:center; justify-content:center;
  padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
  background:var(--cream);
  background-image:radial-gradient(900px 420px at 6% -4%, #FFF4DD 0%, rgba(255,244,221,0) 62%),
                   radial-gradient(700px 380px at 104% 4%, #FFEFF3 0%, rgba(255,239,243,0) 60%),
                   radial-gradient(700px 420px at 50% 108%, #EFF7F1 0%, rgba(239,247,241,0) 62%);
  overflow-y:auto; overscroll-behavior:contain;
}
.lock-card{width:100%; max-width:320px; margin:auto; text-align:center}
.lock-card.shake{animation:lockShake .36s cubic-bezier(.36,.07,.19,.97)}
@keyframes lockShake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)}
  30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)}
}
.lock-logo{font-size:46px; line-height:1.1; filter:drop-shadow(0 4px 8px rgba(180,140,100,.22))}
.lock-card h2{font-size:19px; margin-top:10px; letter-spacing:-.03em}
.lock-sub{font-size:13px; color:var(--muted); margin-top:4px; font-weight:700}
.pin-input{
  width:100%; height:62px; margin-top:18px; padding:0 0 0 12px;
  text-align:center; font-size:30px; font-weight:800; line-height:1; letter-spacing:12px;
  color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow-s); outline:none;
}
.pin-input::placeholder{color:#E2D5C4; font-size:22px; letter-spacing:12px}
.pin-input:focus{border-color:var(--accent); box-shadow:0 0 0 4px rgba(242,155,134,.16)}
.pin-msg{min-height:19px; font-size:12.5px; font-weight:700; color:#C4695E; margin-top:9px}
.pin-msg.ok{color:var(--green-deep)}
.pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:4px}
.pin-pad button{
  height:56px; border-radius:18px; background:#fff; box-shadow:var(--shadow-s);
  font-size:22px; font-weight:800; color:var(--ink);
  display:grid; place-items:center; transition:transform .1s, background .15s;
}
.pin-pad button:active{transform:scale(.95); background:#FFF6EA}
.pin-pad .pad-del{font-size:19px; color:var(--ink2)}
.pin-pad .pad-ok{background:var(--accent-deep); color:#fff; font-size:15px}
.pin-pad .pad-ok:active{background:#C9603F}
.lock-tip{font-size:11.5px; color:var(--muted); margin-top:14px; line-height:1.5}
@media (max-height:620px){
  .lock-logo{font-size:34px} .lock-card h2{font-size:17px; margin-top:6px}
  .pin-input{height:54px; font-size:26px; margin-top:12px}
  .pin-pad button{height:46px; border-radius:15px; font-size:19px}
  .lock-tip{display:none}
}
</style>
</head>
<body>

<!-- 잠금 화면: 비밀번호를 풀기 전까지 대시보드 내용을 완전히 가립니다 -->
<div class="lock-screen" id="lockScreen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="lock-card" id="lockCard">
    <div class="lock-logo" aria-hidden="true">🏡</div>
    <h2 id="lockTitle">우리 가족 대시보드</h2>
    <p class="lock-sub">가족 비밀번호 4자리를 입력해 주세요</p>
    <input id="lockPin" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           aria-label="가족 비밀번호 4자리" aria-describedby="pinMsg">
    <p class="pin-msg" id="pinMsg" role="alert" aria-live="polite"></p>
    <div class="pin-pad" id="pinPad" role="group" aria-label="숫자 키패드">
      <button type="button" data-pin="1">1</button>
      <button type="button" data-pin="2">2</button>
      <button type="button" data-pin="3">3</button>
      <button type="button" data-pin="4">4</button>
      <button type="button" data-pin="5">5</button>
      <button type="button" data-pin="6">6</button>
      <button type="button" data-pin="7">7</button>
      <button type="button" data-pin="8">8</button>
      <button type="button" data-pin="9">9</button>
      <button type="button" data-pin="del" class="pad-del" aria-label="한 자리 지우기">⌫</button>
      <button type="button" data-pin="0">0</button>
      <button type="button" data-pin="ok" class="pad-ok" aria-label="확인">확인</button>
    </div>
    <p class="lock-tip">한 번 풀면 이 기기에서는 다시 묻지 않아요.</p>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="logo">🏡</span>
    <div>
      <h1>우리 가족 대시보드</h1>
      <p id="todayLine">오늘도 화이팅!</p>
    </div>
  </div>
  <button class="icon-btn" data-act="lock" aria-label="화면 잠그기" title="화면 잠그기">🔒</button>

</header>

<div class="pind" id="pind" role="tablist" aria-label="페이지 선택">

  <button data-act="switchTab" data-tab="schedule" role="tab" aria-label="일정 페이지" aria-selected="false"></button>
  <button data-act="switchTab" data-tab="study" role="tab" aria-label="공부 페이지" aria-selected="false"></button>
  <button data-act="switchTab" data-tab="reward" role="tab" aria-label="보상 페이지" aria-selected="false"></button>
</div>

<main id="pager" class="pager">
 <div class="track" id="track">
  <section id="tab-home" class="tab page active" aria-label="홈">
    <div id="home-setup"></div>
    <div id="home-weather"></div>
    <div id="home-countdown"></div>
    <div id="home-morning"></div>
    <div id="home-night"></div>
    <div id="home-today"></div>
    <div id="home-shopping"></div>
    <div id="home-agenda"></div>
    <div id="home-kids"></div>

  <section id="tab-schedule" class="tab page" aria-label="일정">

  </section>

  <section id="tab-study" class="tab page" aria-label="공부">

  </section>

  <section id="tab-reward" class="tab page" aria-label="보상">
    <div id="reward-body"></div>
  </section>
 </div>
</main>

<nav class="tabbar">
  <button data-act="switchTab" data-tab="home" class="active"><span class="ic">🏡</span>홈</button>
  <button data-act="switchTab" data-tab="schedule"><span class="ic">📅</span>일정</button>

</nav>

<div id="toasts"></div>
<div id="fx"></div>

<script>
/* =========================================================
   우리 가족 대시보드 — 단일 파일 가족 앱
   모든 기록은 이 브라우저의 localStorage 에만 저장됩니다.
   ========================================================= */

/* ---------- 1. 상수 ---------- */
var STORAGE_KEY = 'familyDashboard.v1';
var BACKUP_KEY = 'familyDashboard.backup.v1';
var WEATHER_KEY = 'familyDashboard.weather.v1';
var WEATHER_PLACE = '대구';

/* 가족 구성 기본값 — 실제 이름·등교 시간은 이 기기의 데이터(localStorage)나
   가져온 JSON 에만 저장되고, 이 파일에는 들어가지 않습니다.
   설정(⚙️) → 가족 이름에서 언제든 바꿀 수 있어요. */
var DEFAULT_MEMBERS = [
  { id:'mom',  name:'엄마', emoji:'🌸', color:'#FFE1EA', role:'parent', arrive:'' },
  { id:'dad',  name:'아빠', emoji:'🌟', color:'#E7E3FF', role:'parent', arrive:'' },
  { id:'kid1', name:'첫째', emoji:'⭐', color:'#FFE3D3', role:'child', arrive:'08:15' },
  { id:'kid2', name:'둘째', emoji:'🌱', color:'#D9E9FF', role:'child', arrive:'08:15' },
  { id:'kid3', name:'셋째', emoji:'🐣', color:'#FFF2C2', role:'child', arrive:'08:15' }
];
/* 화면에서 쓰는 현재 가족 목록 — 데이터를 불러올 때 syncMembers() 가 맞춰 갱신합니다. */
var MEMBERS = DEFAULT_MEMBERS.slice();
var KIDS = ['kid1','kid2','kid3'];
var WD = ['일','월','화','수','목','금','토'];

var MORNING_STEPS = [
  { id:'wake',   emoji:'⏰', title:'기상',             hint:'알람 듣고 바로 일어나기' },
  { id:'wash',   emoji:'🚿', title:'세수',             hint:'얼굴 씻고 개운하게' },
  { id:'dress',  emoji:'👕', title:'옷입기',           hint:'오늘 옷 스스로 챙겨 입기' },
  { id:'eat',    emoji:'🍳', title:'아침식사',         hint:'든든하게 한 끼' },
  { id:'brush',  emoji:'🪥', title:'양치',             hint:'치카치카 3분' },
  { id:'lotion', emoji:'🧴', title:'로션·선크림',      hint:'얼굴에 촉촉 수분' },
  { id:'bag',    emoji:'🎒', title:'준비물 챙기기',    hint:'알림장·숙제까지 확인' },
  { id:'go',     emoji:'🏫', title:'등교',             hint:'안녕, 다녀올게!' },
  { id:'ontime', emoji:'🏅', title:'지각안하기',       hint:'시간 맞춰 여유 있게 교실 도착!' }
];

/* 9단계로 늘리기 전(8단계) 목록 — 예전 기록 호환용 */
var MORNING_STEPS_V8 = ['wake','wash','dress','eat','brush','lotion','bag','go'];

/* 잠자리 준비 루틴 기본값 — 항목 이름은 설정(⚙️) → 잠자리 루틴에서 바꿀 수 있고,
   실제 항목은 이 기기의 데이터에만 저장됩니다.
   (단계 id 는 예전 기록의 체크를 그대로 살리려고 유지합니다) */
var DEFAULT_NIGHT_STEPS = [
  { id:'nightmed',    emoji:'💊', title:'약 챙기기' },

/* ---------- 3b. 8단계 → 9단계(지각안하기) 기록 호환 ----------

function migrateMorningSteps(st){
  if (!st || !st.morning) return false;

  kidIdsOf(st.members).forEach(function(mid){
    var byDate = st.morning[mid];
    if (!byDate || typeof byDate !== 'object') return;

      var allV8 = MORNING_STEPS_V8.every(function(id){ return !!day[id]; });
      if (allV8) { day.ontime = true; changed = true; }
    });

}

/* ---------- 4. 저장 / 불러오기 ----------
   예전 저장본은 아이 id 가 사람 이름으로 되어 있었습니다. 소스에 이름을 남기지 않으려고,
   저장된 키의 순서(첫째·둘째·셋째) 그대로 새 id(kid1~kid3)로 옮깁니다.
   → 도장·토큰·공부·준비물·일정 기록은 손대지 않고 그대로 이어집니다. */
function legacyKidIds(src){
  var known = { mom:1, dad:1, kid1:1, kid2:1, kid3:1 };
  var ids = [];
  ['study','prep','morning','rewards'].forEach(function(k){
    var o = src[k];
    if (!o || typeof o !== 'object') return;
    Object.keys(o).forEach(function(id){ if (!known[id] && ids.indexOf(id) < 0) ids.push(id); });
  });
  (src.ledger || []).forEach(function(e){
    var id = e && e.memberId;
    if (id && !known[id] && ids.indexOf(id) < 0) ids.push(id);
  });
  return ids;
}

function migrateLegacyMembers(src){
  if (!src || typeof src !== 'object') return false;
  if (Array.isArray(src.members) && src.members.length) return false;
  var ids = legacyKidIds(src);
  if (!ids.length) return false;
  var map = {};
  ids.forEach(function(id, i){ map[id] = 'kid' + (i + 1); });
  function renameKeys(o){
    if (!o || typeof o !== 'object') return;
    Object.keys(o).forEach(function(k){
      if (!map[k]) return;
      if (o[map[k]] === undefined) o[map[k]] = o[k];
      delete o[k];
    });
  }
  renameKeys(src.study); renameKeys(src.prep); renameKeys(src.morning); renameKeys(src.rewards);
  (src.ledger || []).forEach(function(e){ if (e && map[e.memberId]) e.memberId = map[e.memberId]; });
  (src.schedules || []).forEach(function(s){
    if (s && Array.isArray(s.members)) s.members = s.members.map(function(x){ return map[x] || x; });
  });
  if (src.ui){
    ['morningMember','studyMember','rewardMember'].forEach(function(k){
      if (src.ui[k] && map[src.ui[k]]) src.ui[k] = map[src.ui[k]];
    });
  }
  /* 축하 기록은 '아이id|날짜' 형태라 앞부분만 바꿉니다. */
  if (src.celebrated && typeof src.celebrated === 'object'){
    Object.keys(src.celebrated).forEach(function(k){
      var p = k.indexOf('|');
      var id = p < 0 ? k : k.slice(0, p);
      if (!map[id]) return;
      var nk = map[id] + (p < 0 ? '' : k.slice(p));
      src.celebrated[nk] = src.celebrated[k];
      delete src.celebrated[k];
    });
  }
  return true;
}

function normalizeMembers(list){
  var out = [];
  (Array.isArray(list) ? list : []).forEach(function(m){
    if (!m || typeof m !== 'object' || !m.id) return;
    out.push({
      id: String(m.id),
      name: String(m.name == null ? '' : m.name).slice(0, 20) || '이름',
      emoji: String(m.emoji || '🙂').slice(0, 4),
      color: String(m.color || '#EEE7DC').slice(0, 20),
      role: m.role === 'parent' ? 'parent' : 'child',
      arrive: /^([01]?\d|2[0-3]):[0-5]\d$/.test(String(m.arrive || '')) ? String(m.arrive) : ''
    });
  });
  return out.length ? out : defaultMembers();
}

function normalizeNightSteps(list){
  var out = [];
  (Array.isArray(list) ? list : []).forEach(function(s, i){
    if (!s || typeof s !== 'object' || !s.id) return;
    out.push({
      id: String(s.id),
      emoji: String(s.emoji || '🌙').slice(0, 4),
      title: String(s.title == null ? '' : s.title).slice(0, 24) || ('준비 ' + (i + 1))
    });
  });
  return out;
}

function normalize(src){
  var d = defaultState();
  if (!src || typeof src !== 'object') return d;
  migrateLegacyMembers(src);
  var out = {};
  for (var k in d) out[k] = src[k] !== undefined ? src[k] : d[k];
  out.settings = Object.assign({}, d.settings, src.settings || {});
  out.members = normalizeMembers(src.members);
  out.nightSteps = src.nightSteps === undefined ? d.nightSteps : normalizeNightSteps(src.nightSteps);
  var kids = kidIdsOf(out.members);

  out.ui = Object.assign({}, d.ui, src.ui || {});
  ['morningMember','studyMember','rewardMember'].forEach(function(k){
    if (kids.indexOf(out.ui[k]) < 0) out.ui[k] = kids[0] || 'mom';
  });
  if (['home','schedule','study','reward'].indexOf(out.ui.tab) < 0) out.ui.tab = 'home';

  if (!Array.isArray(out.schedules)) out.schedules = [];
  if (!Array.isArray(out.agendas)) out.agendas = [];
  if (!Array.isArray(out.ledger)) out.ledger = [];
  if (!Array.isArray(out.shopping)) out.shopping = [];
  out.shopping.forEach(function(it){
    if (!it || typeof it !== 'object') return;
    if (!it.id) it.id = uid('sh');
    if (!it.emoji) it.emoji = '🛒';
    it.title = String(it.title == null ? '' : it.title).slice(0, 40);
    it.done = !!it.done;
  });
  out.shopping = out.shopping.filter(function(it){ return it && it.title; });
  if (!out.agendaChecks || typeof out.agendaChecks !== 'object') out.agendaChecks = {};
  if (!out.celebrated || typeof out.celebrated !== 'object') out.celebrated = {};

  /* 아이별 기록 — 저장본에 없는 아이는 빈 목록으로 시작합니다. */
  var study = {}, prep = {}, morning = {}, rewards = {};
  kids.forEach(function(mid){
    var s = src.study && src.study[mid];
    var p = src.prep && src.prep[mid];
    var m = src.morning && src.morning[mid];
    var r = src.rewards && src.rewards[mid];
    study[mid] = (Array.isArray(s) ? s : []).filter(function(it){ return it && typeof it === 'object' && it.title; });
    prep[mid]  = (Array.isArray(p) ? p : []).filter(function(it){ return it && typeof it === 'object' && it.title; });
    morning[mid] = (m && typeof m === 'object' && !Array.isArray(m)) ? m : {};
    rewards[mid] = (r && typeof r === 'object' && !Array.isArray(r)) ? r : { goal: 20, name: '보상' };
    rewards[mid].goal = Number(rewards[mid].goal) || 20;
    rewards[mid].name = String(rewards[mid].name || '보상').slice(0, 24);
    study[mid].forEach(function(it){
      it.token = Number(it.token) || 1;
      if (!it.doneDates || typeof it.doneDates !== 'object') it.doneDates = {};
    });
    prep[mid].forEach(function(it){
      if (!it.doneDates || typeof it.doneDates !== 'object') it.doneDates = {};
    });
  });
  out.study = study; out.prep = prep; out.morning = morning; out.rewards = rewards;

  /* 잠자리 준비 — 날짜별 { 단계id: true }. 모르는 값·깨진 값은 버리고 아는 단계만 남깁니다. */
  if (!out.night || typeof out.night !== 'object' || Array.isArray(out.night)) out.night = {};
  var stepIds = out.nightSteps.map(function(s){ return s.id; });
  Object.keys(out.night).forEach(function(nDate){
    var nDay = out.night[nDate];
    if (!nDay || typeof nDay !== 'object' || Array.isArray(nDay)) { delete out.night[nDate]; return; }
    var clean = {};
    stepIds.forEach(function(id){ if (nDay[id]) clean[id] = true; });
    out.night[nDate] = clean;
  });

  out.schedules = out.schedules.filter(function(s){ return s && typeof s === 'object' && s.title; });
  out.schedules.forEach(function(s){
    if (!Array.isArray(s.members)) s.members = [];
    if (!s.id) s.id = uid('s');
    if (s.kind !== 'weekly' && s.kind !== 'date') s.kind = s.date ? 'date' : 'weekly';
  });
  out.version = 1;
  out.seedVersion = src.seedVersion !== undefined ? (Number(src.seedVersion) || 1) : 1;
  return out;
}

/* ---------- 4b. 저장본 형식 맞추기 ----------
   이제 소스에는 시드 일정이 없으므로, 저장본의 시드 버전 숫자만 최신으로 맞춥니다.
   (일정·기록은 저장본 그대로 둡니다) */
function migrateSeeds(st){
  var from = Number(st.seedVersion) || 1;
  st.seedVersion = SEED_VERSION;
  return from !== SEED_VERSION;
}

/* load() 안에서 쓰는 정렬 (state 없이 동작) */
function sortSchedules2(list){
  list.sort(function(a,b){
    var ka = a.kind === 'weekly' ? '0'+(a.day||0) : '1'+a.date;
    var kb = b.kind === 'weekly' ? '0'+(b.day||0) : '1'+b.date;
    if (ka !== kb) return ka < kb ? -1 : 1;
    return (a.start||'99:99') < (b.start||'99:99') ? -1 : 1;
  });
  return list;
}

function load(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      var legacy = localStorage.getItem('familyDashboard');
      if (legacy) raw = legacy;
    }
    var st = normalize(raw ? JSON.parse(raw) : null);
    if (raw) {
      /* 예전 저장본(아이 id가 이름이던 것)을 새 형식으로 옮긴 경우, 원본을 한 번 백업해 두고 저장합니다.
         기록(도장·토큰·공부·준비물·일정)은 그대로 이어지고, 새로 시작하는 기기는 빈 상태 그대로입니다. */
      var changed = migrateSeeds(st);
      if (migrateMorningSteps(st)) changed = true;
      if (changed) {
        try { if (!localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, raw); } catch (e) {}
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); } catch (e) {}
      }
    }
    return st;
  } catch (e) { return defaultState(); }
}
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---------- 5. 계산 ( 순수 로직 ) ---------- */
function schedulesForDate(dateStr){
  var d = parseYmd(dateStr), idx = wdIdx(d);
  return state.schedules.filter(function(s){
    return s.kind === 'weekly' ? Number(s.day) === idx : s.date === dateStr;
  }).slice().sort(function(a,b){
    var x = a.start || '99:99', y = b.start || '99:99';
    return x < y ? -1 : (x > y ? 1 : 0);
  });
}

function weekDates(){
  var base = nowDate();
  var idx = wdIdx(base);
  var mon = new Date(base.getFullYear(), base.getMonth(), base.getDate() - (idx-1));
  var arr = [];
  for (var i=0;i<7;i++){
    var d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i);
    arr.push(ymd(d));
  }
  return arr;
}

function balanceOf(mid){
  var sum = 0;
  state.ledger.forEach(function(e){ if (e.memberId === mid) sum += Number(e.delta) || 0; });
  return sum;
}

function stampedSet(){
  var set = {};
  state.ledger.forEach(function(e){
    if (Number(e.delta) > 0 && e.srcKey && e.srcKey.indexOf('study:') === 0){
      var parts = e.srcKey.split(':');
      if (parts[3]) set[parts[3]] = true;
    }
  });
  Object.keys(state.agendaChecks || {}).forEach(function(date){
    var day = state.agendaChecks[date] || {};
    var any = false;
    Object.keys(day).forEach(function(agId){
      var row = day[agId] || {};
      Object.keys(row).forEach(function(mid){ if (row[mid]) any = true; });
    });
    if (any) set[date] = true;
  });
  return set;
}

function streakLen(){
  var set = stampedSet();
  var d = nowDate();
  if (!set[ymd(d)]) d = new Date(d.getFullYear(), d.getMonth(), d.getDate()-1);
  var n = 0;
  while (set[ymd(d)]) {
    n++;
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate()-1);
  }
  return n;
}

function monthStampCount(){
  var set = stampedSet(), base = nowDate();
  var prefix = base.getFullYear()+'-'+pad2(base.getMonth()+1)+'-';
  var n = 0;
  Object.keys(set).forEach(function(date){ if (date.indexOf(prefix) === 0) n++; });
  return n;
}

function studyItems(mid){

/* 날씨 코드 → 아이콘/설명 */
function wmo(code){
  var c = Number(code) || 0;
  if (c === 0) return { emoji:'☀️', label:'맑음' };
  if (c === 1) return { emoji:'🌤️', label:'대체로 맑음' };
  if (c === 2) return { emoji:'⛅', label:'구름 조금' };
  if (c === 3) return { emoji:'☁️', label:'구름 많음' };
  if (c === 45 || c === 48) return { emoji:'🌫️', label:'안개' };
  if (c >= 51 && c <= 57) return { emoji:'🌦️', label:'이슬비' };
  if (c >= 61 && c <= 65) return { emoji:'🌧️', label:'비' };
  if (c === 66 || c === 67) return { emoji:'🌧️', label:'진눈깨비' };
  if (c >= 71 && c <= 77) return { emoji:'❄️', label:'눈' };
  if (c >= 80 && c <= 82) return { emoji:'🌦️', label:'소나기' };
  if (c === 85 || c === 86) return { emoji:'🌨️', label:'눈 소나기' };
  if (c >= 95) return { emoji:'⛈️', label:'천둥번개' };
  return { emoji:'🌤️', label:'알 수 없음' };
}
function isRainy(c){ c=Number(c)||0; return (c>=51 && c<=67) || (c>=80 && c<=82) || c>=95; }
function isSnowy(c){ c=Number(c)||0; return (c>=71 && c<=77) || c===85 || c===86; }

/* 조건에 따른 "챙길 것" 배지 */
function weatherBadges(w){
  var out = [];
  var tmax = Number(w.tmax), tmin = Number(w.tmin), pop = Number(w.pop) || 0, code = Number(w.code) || 0;
  if (pop >= 40 || isRainy(code)) out.push({ k:'rain', e:'☂️', t:'우산 챙기기' });
  if (tmin <= 11 || (tmax - tmin) >= 10) out.push({ k:'coat', e:'🧥', t:'겉옷 챙기기' });
  if (tmax >= 23) out.push({ k:'water', e:'💧', t:'물병 챙기기' });
  if (isSnowy(code) || tmin <= 0) out.push({ k:'snow', e:'🧤', t:'장갑 챙기기' });
  if (!out.length) out.push({ k:'none', e:'😎', t:'오늘은 챙길 것 없음' });
  return out;
}

/* ---------- 6. 기록 변경 ---------- */
function addLedger(memberId, delta, reason, srcKey){
  if (srcKey && ledgerHas(srcKey)) return null;
  var e = { id: uid('lg'), memberId: memberId, delta: Number(delta)||0, reason: reason,
            at: new Date().toISOString(), srcKey: srcKey || null };
  state.ledger.push(e);
  save();
  return e;
}
function removeLedgerBySrc(srcKey){
  var before = state.ledger.length;
  state.ledger = state.ledger.filter(function(e){ return e.srcKey !== srcKey; });
  if (state.ledger.length !== before) save();
}

function toggleMorning(mid, stepId){
  var date = today();
  if (!state.morning[mid]) state.morning[mid] = {};
  var day = state.morning[mid][date];
  if (!day) { day = {}; state.morning[mid][date] = day; }
  var key = 'morning:'+mid+':'+date;

  if (day[stepId]) {
    delete day[stepId];
    removeLedgerBySrc(key);
  } else {
    day[stepId] = true;
  }
  var count = MORNING_STEPS.filter(function(s){ return !!day[s.id]; }).length;
  var complete = count === MORNING_STEPS.length;
  var bonus = 0;
  if (complete) {
    var e = addLedger(mid, 1, '등교 준비 완료 보너스', key);
    bonus = e ? 1 : 0;
  } else {
    removeLedgerBySrc(key);
  }
  save();
  return { on: !!day[stepId], count: count, complete: complete, bonus: bonus, stepId: stepId };
}

function resetMorning(mid){
  var date = today();
  if (state.morning[mid]) state.morning[mid][date] = {};
  removeLedgerBySrc('morning:'+mid+':'+date);
  save();
}

/* 잠자리 준비 — 오늘 날짜 기준으로 하나씩 켜고 끕니다(토큰·원장은 건드리지 않음) */
function toggleNight(stepId){
  var date = today();
  if (!state.night || typeof state.night !== 'object' || Array.isArray(state.night)) state.night = {};
  var day = state.night[date];
  if (!day) { day = {}; state.night[date] = day; }
  if (day[stepId]) delete day[stepId]; else day[stepId] = true;
  var count = nightCount(date);
  save();
  return { on: !!day[stepId], count: count, complete: count === NIGHT_STEPS.length, stepId: stepId };
}
function resetNight(){
  var date = today();
  if (!state.night || typeof state.night !== 'object' || Array.isArray(state.night)) state.night = {};
  state.night[date] = {};
  save();
}

function toggleStudy(mid, itemId){
  var it = (state.study[mid] || []).filter(function(x){ return x.id === itemId; })[0];
  if (!it) return null;
  var date = today(), key = 'study:'+mid+':'+itemId+':'+date;
  if (it.doneDates[date]) {
    delete it.doneDates[date];
    removeLedgerBySrc(key);
    save();
    return { on:false, token:0, item:it, allDone:false };
  }
  it.doneDates[date] = true;
  var tok = Number(it.token) || Number(state.settings.tokenPerStudy) || 1;
  addLedger(mid, tok, it.title + ' 완료', key);
  save();
  return { on:true, token:tok, item:it, allDone: studyAllDone(mid, date) };
}

function togglePrep(mid, itemId){
  var it = (state.prep[mid] || []).filter(function(x){ return x.id === itemId; })[0];
  if (!it) return;
  var date = today();
  if (it.doneDates[date]) delete it.doneDates[date];
  else it.doneDates[date] = true;
  save();
}

function toggleAgenda(mid, agId){
  var date = today();
  if (!state.agendaChecks[date]) state.agendaChecks[date] = {};
  var day = state.agendaChecks[date];
  if (!day[agId]) day[agId] = {};
  var mem = memberById(mid);
  var key = 'agenda:'+mid+':'+agId+':'+date;
  var ag = state.agendas.filter(function(a){ return a.id === agId; })[0];

  if (day[agId][mid]) {
    delete day[agId][mid];
    removeLedgerBySrc(key);
    save();
    return { on:false, token:0 };
  }
  day[agId][mid] = true;
  var token = 0;
  if (mem && mem.role === 'child') {
    var e = addLedger(mid, 1, (ag ? ag.title : '안건') + ' 지키기', key);
    token = e ? 1 : 0;
  }
  save();
  return { on:true, token:token };
}

function exchangeReward(mid){
  var r = state.rewards[mid];
  if (!r) return { ok:false, need:0 };
  var bal = balanceOf(mid);
  if (bal < r.goal) return { ok:false, need: r.goal - bal };
  addLedger(mid, -r.goal, '보상 교환: ' + r.name, 'reward:'+mid+':'+Date.now());
  save();
  return { ok:true, spent: r.goal, name: r.name };
}

function sortSchedules(){
  state.schedules.sort(function(a,b){
    var ka = a.kind === 'weekly' ? '0'+(a.day||0) : '1'+a.date;
    var kb = b.kind === 'weekly' ? '0'+(b.day||0) : '1'+b.date;
    if (ka !== kb) return ka < kb ? -1 : 1;
    return (a.start||'99:99') < (b.start||'99:99') ? -1 : 1;
  });
}
function addSchedule(o){
  var s = {
    id: uid('s'), kind: o.kind || 'weekly',
    day: o.kind === 'weekly' ? Number(o.day)||1 : null,
    date: o.kind === 'date' ? (o.date || today()) : null,
    start: o.start || '', end: o.end || '',
    title: o.title || '새 일정', members: o.members || [], note: o.note || ''
  };
  state.schedules.push(s);
  save();
  return s;
}
function removeSchedule(id){
  state.schedules = state.schedules.filter(function(s){ return s.id !== id; });
  save();
}
function addAgenda(title, emoji){
  var a = { id: uid('ag'), emoji: emoji || '📌', title: title };
  state.agendas.push(a);
  save();
  return a;
}
function removeAgenda(id){
  state.agendas = state.agendas.filter(function(a){ return a.id !== id; });
  Object.keys(state.agendaChecks||{}).forEach(function(date){
    var day = state.agendaChecks[date];
    if (day && day[id]){
      Object.keys(day[id]).forEach(function(mid){ removeLedgerBySrc('agenda:'+mid+':'+id+':'+date); });
      delete day[id];
    }
  });
  save();
}
function addStudyItem(mid, title, emoji, token, pinned){
  var it = { id: uid('st'), title: title, emoji: emoji || '📘', token: Number(token)||1,
             pinned: !!pinned, doneDates: {} };
  if (!state.study[mid]) state.study[mid] = [];
  state.study[mid].push(it);
  save();
  return it;
}
function updateStudyItem(mid, id, patch){
  var it = (state.study[mid]||[]).filter(function(x){ return x.id === id; })[0];
  if (!it) return;
  if (patch.title !== undefined) it.title = patch.title;
  if (patch.emoji !== undefined) it.emoji = patch.emoji;
  if (patch.token !== undefined) it.token = Number(patch.token)||1;
  if (patch.pinned !== undefined) it.pinned = !!patch.pinned;
  save();
}
function removeStudyItem(mid, id){
  state.study[mid] = (state.study[mid]||[]).filter(function(x){ return x.id !== id; });
  Object.keys(state.celebrated||{}).forEach(function(k){ if (k.indexOf(mid+'|')===0) delete state.celebrated[k]; });
  save();
}
function addPrepItem(mid, title){
  if (!state.prep[mid]) state.prep[mid] = [];
  state.prep[mid].push({ id: uid('pp'), title: title, doneDates: {} });
  save();
}
function removePrepItem(mid, id){
  state.prep[mid] = (state.prep[mid]||[]).filter(function(x){ return x.id !== id; });
  save();
}

/* ---- 홈: 등교 카운트다운 ---- */
/* 등교 시간이 있는 아이들을 시간대별로 묶어 줄을 만듭니다.
   등교 시간은 설정(⚙️) → 가족 이름에서 아이마다 정하고, 이 기기의 데이터에만 저장됩니다. */
function arrivalGroups(){
  var byTime = {}, order = [];
  kidMembers().forEach(function(m){
    var t = m.arrive || '';
    if (!t) return;
    if (!byTime[t]) { byTime[t] = []; order.push(t); }
    byTime[t].push(m);
  });
  order.sort();
  return order.map(function(t){
    var list = byTime[t];
    return {
      key: 'g' + t.replace(':', ''),
      label: list.map(function(m){ return m.name; }).join('·'),
      emoji: list[0].emoji, color: list[0].color,
      members: list.map(function(m){ return m.id; }), time: t
    };
  });
}

/* 테스트·미리보기용 시각 지정 ('HH:MM' 또는 'HH:MM:SS'). 평소에는 null. */
var clockTimeOverride = null;

function clockNow(){
  var base = nowDate();
  var real = new Date();
  var t = clockTimeOverride ? String(clockTimeOverride).split(':') : null;
  return new Date(base.getFullYear(), base.getMonth(), base.getDate(),
    t ? (Number(t[0])||0) : real.getHours(),
    t ? (Number(t[1])||0) : real.getMinutes(),
    t ? (Number(t[2])||0) : real.getSeconds(), 0);
}
function isSchoolDay(dateStr){
  var w = parseYmd(dateStr).getDay();
  return w >= 1 && w <= 5;
}
function nextSchoolDay(dateStr){
  var s = dateStr;
  for (var i=0;i<8;i++){
    s = shiftDate(s, 1);
    if (isSchoolDay(s)) return s;
  }
  return s;
}
function arrivalTimeFor(group){
  /* 등교 시간 변경은 저장된 일정/설정으로만 다루고, 예전 특수일 표는 두지 않습니다. */
  return { time: group.time, override: false, short: '' };
}
function atClock(dateStr, hhmm){
  var p = String(hhmm).split(':');
  var d = parseYmd(dateStr);
  d.setHours(Number(p[0])||0, Number(p[1])||0, 0, 0);
  return d;
}
function ampmTime(hhmm){
  var p = String(hhmm).split(':');
  var h = Number(p[0])||0, m = Number(p[1])||0;
  var ap = h < 12 ? '오전' : '오후';
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return ap + ' ' + h12 + ':' + pad2(m);
}
/* 1초 단위 시계 표시: 1시간 이상이면 H:MM:SS, 그 전에는 MM:SS */
function cdClock(sec){
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h > 0 ? h + ':' + pad2(m) : pad2(m)) + ':' + pad2(s);
}
/* 다음 등교까지처럼 하루를 넘기는 시간 */
function cdLong(sec){
  sec = Math.max(0, Math.round(sec));
  var d = Math.floor(sec/86400), h = Math.floor((sec%86400)/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (d > 0) return d + '일 ' + pad2(h) + ':' + pad2(m) + ':' + pad2(s);
  return cdClock(sec);
}
function cdHasGoStamp(mid, dateStr){
  return !!morningDay(mid, dateStr).go;
}

/* 두 타이머의 지금 상태 계산 */
function arrivalStates(){
  var date = today();
  var schoolDay = isSchoolDay(date);
  var next = nextSchoolDay(date);
  var now = clockNow();
  var out = [];
  arrivalGroups().forEach(function(g){
    var target = atClock(date, g.time);
    var nextTarget = atClock(next, g.time);
    var left = target.getTime() - now.getTime();
    var st = {
      group: g, time: g.time, override: false, short: '',
      nextDate: next, nextTime: g.time,
      nextLeftMs: nextTarget.getTime() - now.getTime(),
      leftMs: left, state: 'run'
    };
    var allGone = g.members.every(function(mid){ return cdHasGoStamp(mid, date); });
    if (!schoolDay) st.state = 'weekend';
    else if (allGone) st.state = 'gone';
    else if (left <= 0) st.state = 'done';
    if (st.state !== 'run') st.leftMs = st.nextLeftMs;
    out.push(st);
  });
  return out;
}

function schoolCountdownCard(){
  var date = today();

  return '<div class="card cd-card">'

/* 1초마다 숫자만 다시 칠합니다 (카드를 새로 그리지 않아 화면이 깜빡이지 않습니다) */
function paintSchool(){
  var rows = el('cdRows');
  if (!rows) return;
  if (rows.getAttribute('data-date') !== today()) { renderHome(); return; }   /* 자정을 넘겼다면 새로 그리기 */
  var now = clockNow();
  var nowEl = el('cdNow');
  if (nowEl) nowEl.textContent = '지금 ' + ampmTime(pad2(now.getHours())+':'+pad2(now.getMinutes())) + ':' + pad2(now.getSeconds());

  var states = arrivalStates();
  var anyRun = false;
  states.forEach(function(st){
    var row = rows.querySelector('.cd-row[data-key="'+st.group.key+'"]');
    if (!row) return;
    var num = row.querySelector('.cd-num'), note = row.querySelector('.cd-note');
    if (!num || !note) return;
    var sec = Math.max(0, Math.round(st.leftMs/1000));
    var cls = 'cd-row ' + st.state;
    if (st.state === 'run'){
      anyRun = true;
      num.textContent = cdClock(sec);
      if (sec <= 300) { cls += ' urgent'; note.textContent = '5분 남았어요!'; }
      else if (sec <= 600) { cls += ' warn'; note.textContent = '10분 남았어요'; }
      else if (sec <= 1800) { note.textContent = '곧 출발할 시간'; }
      else { note.textContent = '여유 있어요'; }
    } else if (st.state === 'gone'){
      num.textContent = '완료'; note.textContent = '도장 찍었어요';
    } else if (st.state === 'done'){
      num.textContent = '완료'; note.textContent = '오늘 등교 끝';
    } else {
      num.textContent = '주말'; note.textContent = '등교 없어요';
    }
    row.className = cls;
  });

  var nx = el('cdNext');
  if (!nx) return;
  if (anyRun){ nx.textContent = ''; return; }
  var best = null;
  states.forEach(function(st){ if (!best || st.nextLeftMs < best.nextLeftMs) best = st; });
  if (!best){ nx.textContent = ''; return; }
  var nd = parseYmd(best.nextDate);
  nx.textContent = '다음 등교까지 ' + cdLong(best.nextLeftMs/1000)
    + ' · ' + WD[nd.getDay()] + '요일 ' + best.group.label + ' ' + ampmTime(best.nextTime);
}

var timer = { min:20, total:20*60, left:20*60, running:false, endAt:0, handle:null };

function fmtClock(sec){
  sec = Math.max(0, sec);
  return pad2(Math.floor(sec/60))+':'+pad2(sec%60);
}
function paintTimer(){
  var disp = el('tDisp');
  if (disp) disp.textContent = fmtClock(timer.left);
  var ring = el('tRing');
  if (ring) {
    var p = timer.total ? (1 - timer.left / timer.total) * 100 : 0;
    ring.style.setProperty('--p', String(Math.max(0, Math.min(100, p))));
  }
  var st = el('timerState');
  if (st) {
    st.textContent = timer.running ? '공부 중 ✏️'
      : (timer.left === 0 ? '끝! 다시 시작해요'
      : (timer.left === timer.total ? '준비' : '일시정지'));
  }
  var b = el('timerStartBtn');
  if (b) b.textContent = timer.running ? '⏸ 일시정지'
    : (timer.left === timer.total ? '▶ 시작' : (timer.left === 0 ? '▶ 다시 시작' : '▶ 계속'));
  var presets = document.querySelectorAll('[data-act="timerSet"]');
  for (var i=0;i<presets.length;i++){
    presets[i].classList.toggle('on', Number(presets[i].getAttribute('data-min')) === timer.min);
  }
}
function tickTimer(){
  timer.left = Math.max(0, Math.round((timer.endAt - Date.now())/1000));
  paintTimer();
  if (timer.left <= 0) finishTimer();
}
function startPauseTimer(){
  if (timer.running) {
    clearInterval(timer.handle);
    timer.running = false;
    timer.left = Math.max(0, Math.round((timer.endAt - Date.now())/1000));
    paintTimer();
    return;
  }
  if (timer.left <= 0) timer.left = timer.total;
  timer.running = true;
  timer.endAt = Date.now() + timer.left*1000;
  clearInterval(timer.handle);
  timer.handle = setInterval(tickTimer, 250);
  paintTimer();
}
function resetTimer(){
  clearInterval(timer.handle);
  timer.running = false;
  timer.left = timer.total;
  paintTimer();
}
function setTimerMin(min){
  clearInterval(timer.handle);
  timer.running = false;
  timer.min = min;
  cookTimerTotal(min);
  paintTimer();
}
function cookTimerTotal(min){
  timer.total = Math.max(60, Math.round(min*60));
  timer.left = timer.total;
}
function finishTimer(){
  clearInterval(timer.handle);
  timer.running = false;
  timer.left = 0;
  paintTimer();
  beep(3);
  if (navigator.vibrate) { try { navigator.vibrate([200,120,200]); } catch(e){} }
  celebrate('⏰', '시간 다 됐어요!', '공부 끝! 잠깐 쉬어 가요 🌿');
}

/* ---------- 9. 소리 / 효과 ---------- */
var actx = null;
function audio(){
  try {
    if (!actx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      actx = new Ctx();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch(e){ return null; }
}
function beep(times){
  var a = audio(); if (!a) return;
  times = times || 1;
  var t0 = a.currentTime;
  for (var i=0;i<times;i++){
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    o.connect(g); g.connect(a.destination);
    var s = t0 + i*0.45;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(0.3, s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s+0.3);
    o.start(s); o.stop(s+0.32);
  }
}
function chime(){
  var a = audio(); if (!a) return;
  var t0 = a.currentTime, notes = [660, 880, 1180];
  notes.forEach(function(f, i){
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    o.connect(g); g.connect(a.destination);
    var s = t0 + i*0.09;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(0.16, s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s+0.32);
    o.start(s); o.stop(s+0.34);
  });
}
function toast(msg){
  var layer = el('toasts'); if (!layer) return;
  layer.innerHTML = '';   /* 한 번에 하나만 보이게 */
  var d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  layer.appendChild(d);
  setTimeout(function(){
    d.classList.add('out');
    setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 320);
  }, 1700);
}
function floatCoin(x, y, text){
  var layer = el('fx'); if (!layer) return;
  var d = document.createElement('div');
  d.className = 'float-coin';
  d.textContent = text || '+1🪙';
  d.style.left = (x||window.innerWidth/2)+'px';
  d.style.top = (y||window.innerHeight/2)+'px';
  layer.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 1000);
}
function confetti(){
  var layer = el('fx'); if (!layer) return;
  var pool = ['🎉','✨','⭐','🥳','🌟','💛'];
  for (var i=0;i<16;i++){
    var s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = pool[Math.floor(Math.random()*pool.length)];
    s.style.left = (6 + Math.random()*88)+'vw';
    s.style.animationDelay = (Math.random()*0.35)+'s';
    s.style.fontSize = (13 + Math.random()*15)+'px';
    layer.appendChild(s);
    (function(node){ setTimeout(function(){ if (node.parentNode) node.parentNode.removeChild(node); }, 2600); })(s);
  }
}
function celebrate(big, title, sub){
  var layer = el('fx'); if (!layer) return;
  var d = document.createElement('div');
  d.className = 'celebrate';
  d.innerHTML = '<div class="cel-emoji">'+big+'</div><b>'+esc(title)+'</b>'
              + (sub ? '<span>'+esc(sub)+'</span>' : '');
  layer.appendChild(d);
  confetti();
  setTimeout(function(){
    d.classList.add('out');
    setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 380);
  }, 1900);
}
function stampFx(stepId){
  var node = document.querySelector('[data-step="'+stepId+'"] .stamp');
  if (!node) return;
  node.classList.add('pop');
  node.addEventListener('animationend', function(){ node.classList.remove('pop'); }, { once:true });

/* ---------- 11. 날씨 불러오기 ---------- */
function loadWeather(){
  weather = { status:'loading', data:null, stale:false };
  renderHome();
  var ctrl = null, timerId = null;
  try {
    if (typeof AbortController !== 'undefined') {
      ctrl = new AbortController();
      timerId = setTimeout(function(){ ctrl.abort(); }, 8000);
    }
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=35.824&longitude=128.545'
      + '&current=temperature_2m,weather_code'
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code'
      + '&timezone=Asia%2FSeoul&forecast_days=1';
    fetch(url, ctrl ? { signal: ctrl.signal } : {})
      .then(function(r){ if (!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(function(j){
        if (timerId) clearTimeout(timerId);
        var daily = j.daily || {};
        var cur = Math.round(Number((j.current||{}).temperature_2m));
        var tmax = Math.round(Number(daily.temperature_2m_max[0]));
        var tmin = Math.round(Number(daily.temperature_2m_min[0]));
        var pop = Math.round(Number((daily.precipitation_probability_max||[0])[0]) || 0);
        var code = Number(((daily.weather_code||[])[0] !== undefined ? daily.weather_code[0] : (j.current||{}).weather_code)) || 0;
        var meta = wmo(code);
        var now = new Date();
        weather = { status:'ok', stale:false, savedAt: today(), data:{
          cur: cur, tmax: tmax, tmin: tmin, pop: pop, code: code,
          emoji: meta.emoji, label: meta.label,
          time: pad2(now.getHours())+':'+pad2(now.getMinutes()),
          badges: weatherBadges({ tmax:tmax, tmin:tmin, pop:pop, code:code })
        }};
        try { localStorage.setItem(WEATHER_KEY, JSON.stringify(weather)); } catch(e){}
        renderHome();
      })
      .catch(function(){
        if (timerId) clearTimeout(timerId);
        fallbackWeather();
      });
  } catch (e) {
    fallbackWeather();
  }
}
function fallbackWeather(){
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(WEATHER_KEY) || 'null'); } catch(e){}
  if (cached && cached.data && cached.savedAt === today()) {
    weather = { status:'ok', stale:true, data: cached.data };
  } else {
    weather = { status:'error', data:null, stale:false };
  }
  renderHome();
}

/* ---------- 12. 내보내기 / 가져오기 ---------- */
function exportJSON(){
  var data = { app:'family-dashboard', appVersion:1, exportedAt:new Date().toISOString() };
  for (var k in state) data[k] = state[k];
  var text = JSON.stringify(data, null, 2);
  try {
    var blob = new Blob([text], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '우리가족대시보드-'+today()+'.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      URL.revokeObjectURL(a.href);
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 2500);
    toast('기록을 파일로 내보냈어요!');
  } catch (e) {
    toast('내보내기에 실패했어요. 다른 브라우저에서 시도해 주세요.');
  }
}
function importJSON(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(String(reader.result));
      if (!data || typeof data !== 'object' || (!data.study && !data.ledger)) throw new Error('bad');
      state = normalize(data);
      migrateSeeds(state);
      migrateMorningSteps(state);
      syncMembers();
      save();
      closeModal();
      renderAll();
      toast('기록을 그대로 불러왔어요!');
    } catch (e) {
      toast('파일을 읽지 못했어요. 내보낸 JSON 파일인지 확인해 주세요.');
    }
  };
  reader.readAsText(file);
}

/* 기록(도장·토큰·일정·공부)은 그대로 두고 가족 이름과 잠자리 루틴 이름만 채웁니다. */
function importProfileJSON(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(String(reader.result));
      if (!data || typeof data !== 'object') throw new Error('bad');
      var incoming = normalizeMembers(data.members);
      var incomingKids = kidIdsOf(incoming);
      var localKids = KIDS.slice();
      state.members = state.members.map(function(m){
        if (m.role !== 'child') return m;
        var idx = localKids.indexOf(m.id);
        var srcKid = idx >= 0 ? incoming.filter(function(x){ return x.id === incomingKids[idx]; })[0] : null;
        if (!srcKid) return m;
        return { id: m.id, name: srcKid.name, emoji: srcKid.emoji, color: srcKid.color,
                 role: 'child', arrive: srcKid.arrive || m.arrive };
      });
      if (Array.isArray(data.nightSteps) && data.nightSteps.length) {
        var oldSteps = state.nightSteps || [];
        var steps = normalizeNightSteps(data.nightSteps);
        state.nightSteps = steps.map(function(s, i){
          return { id: oldSteps[i] ? oldSteps[i].id : s.id, emoji: s.emoji, title: s.title };
        });
      }
      syncMembers(); save(); closeModal(); renderAll();
      toast('이름과 잠자리 루틴을 채웠어요');
    } catch (e) {
      toast('파일을 읽지 못했어요. 내보낸 JSON 파일인지 확인해 주세요.');
    }
  };
  reader.readAsText(file);
}

document.addEventListener('keydown', function(e){
  if (lockedNow()) return;                 /* 잠금 화면에서는 대시보드 단축키를 쓰지 않음 */
  if (e.key === 'Escape') closeModal();
